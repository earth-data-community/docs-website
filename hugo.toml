baseURL = 'https://earth-data-community.github.io/docs-website/'
locale = 'en-us'
title = 'Earth Data Community'

# Default bookFlatSection=true for every docs section page (menu shows children
# at the same level instead of nested). Individual pages can still override it.
[[cascade]]
  [cascade.target]
    kind = '{section,page}'
    path = '/docs/**'
  bookFlatSection = true

[module]
  [[module.imports]]
    path = "github.com/earth-data-community/galaxy-tools"

    [[module.imports.mounts]]
      source = "README.md" #readme about galaxy tools
      target = "content/docs/galaxy-tools/_index.md"

    [[module.imports.mounts]]
      source = "CONTRIBUTING.md"
      target = "content/docs/galaxy-tools/how-to-contribute-new-tool.md"

    [[module.imports.mounts]]
      source = "tools/" #tools/*/*.md only, each tool doc shows as a section under docs/galaxy-tools/tools/
      target = "content/docs/galaxy-tools/tools/"
      files = ["**/*.md"]

  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book" #theme

# Parameters for github action
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[security]
  allowContent = [
    '^text/html$',
    '^text/markdown$',
    '^text/plain$',
    '^image/',
    '^application/json$',
    '^application/pdf$'
  ]

  
# Book configuration
disablePathToLower = true
enableGitInfo = true

[outputFormats]
[outputFormats.txt]
  mediaType = 'text/plain'
  baseName = 'source'
  isPlainText = true

[outputs]
  home = ['html', 'txt', 'rss']
  page = ['html', 'txt']
  section = ['html', 'txt']

# Needed for mermaid/katex shortcodes
[markup]
[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

[markup.highlight]
  style = 'base16-snazzy'

# Multi-lingual mode config
# There are different options to translate files
# See https://gohugo.io/content-management/multilingual/#translation-by-filename
# And https://gohugo.io/content-management/multilingual/#translation-by-content-directory
defaultContentLanguage = 'en'

# Menu Configuration
[menu]
[[menu.home]]
  name = 'Documentation'
  pageRef = '/docs/'
  weight = 2

[[menu.home]]
  name = 'Blog'
  pageRef = '/posts/'
  weight = 3

[[menu.home]]
  name = 'Github'
  url = 'https://github.com/earth-data-community/'
  weight = 4

# [[menu.before]]
[[menu.after]]
  name = 'Github'
  url = 'https://github.com/earth-data-community/'
  weight = 10

[params]
  # (Optional, default light) Sets color theme: light, dark or auto.
  # Theme 'auto' switches between dark and light modes based on browser/os preferences
  BookTheme = 'auto'

  # (Optional, default none) Controls table of contents visibility on right side of pages.
  # Start and end levels can be controlled globally with markup.tableOfContents setting.
  # You can also specify this parameter per page in front matter.
  # BookToC = true

  # (Optional, default favicon.png) Set the path to a favicon file.
  # If the favicon is /static/favicon.png then the path would be favicon.png
  # BookFavicon = 'favicon.png'

  # (Optional, default none) Set the path to a logo for the book.
  # If the logo is /static/logo.png then the path would be logo.png
  # BookLogo = 'logo.png'

  # (Optional, default docs) Specify root page to render child pages as menu.
  # Page is resoled by .GetPage function: https://gohugo.io/functions/getpage/
  # For backward compatibility you can set '*' to render all sections to menu. Acts same as '/'
  BookSection = 'docs'

  # Here for backward compatibility, not required.
  # It's here as an example how to use it with BookLastChangeLink or BookEditLink
  BookRepo = 'https://github.com/earth-data-community/docs-website'

  # (Optional, default none) Set template for commit link for the page. Requires enableGitInfo.
  # When set enabled 'Last Modified' and a link to the commit in the footer of the page.
  # Param is executed as template using .Site, .Page and .GitInfo as context.
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'

  # (Optional, default none) Enables the 'Edit this page' link in the footer of
  # the page. The actual href is computed by the layout override
  # layouts/partials/docs/links/edit.html, which maps the content path back to
  # the source repo/file via params.editLinks (works for Hugo module content
  # too). The value below only acts as the on/off switch.
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/'

  # (Optional, default 'January 2, 2006') Configure the date format used on the pages
  # - In git information
  # - In blog posts
  # https://gohugo.io/functions/time/format/
  BookDateFormat = '2 January 2006'

  # (Optional, default true) Enables search function with fuse.js.,
  # Index is built on fly, therefore it might slowdown your website.
  # Configuration for indexing can be adjusted in i18n folder per language.
  BookSearch = true

  # (Optional, default true) Enables comments template on pages
  # By default partials/docs/comments.html includes Disqus template
  # See https://gohugo.io/content-management/comments/#configure-disqus
  # Can be overwritten by same param in page frontmatter
  BookComments = true

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables portable links and link checks in markdown pages.
  # Portable links meant to work with text editors and let you write markdown without {{< relref >}} shortcode
  # Hugo Book will print warning or error if page referenced in markdown does not exists.
  # Possible values are false | 'warning' | 'error'
  BookPortableLinks = 'warning'

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false)
  # When set to 'preache' it enables a service worker that caches visited pages and resources for offline use.
  # Possible values are false | true | 'precache'
  BookServiceWorker = 'precache'

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables a drop-down menu for translations only if a translation is present.
  BookTranslatedOnly = false

# --- Edit link mapping, one entry per module (root = modulePath "") ---

  [[params.editLinks]]
    modulePath = "github.com/earth-data-community/galaxy-tools"
    repo = "https://github.com/earth-data-community/galaxy-tools"
    branch = "main"

    # Exact single-file mounts (README.md, CONTRIBUTING.md)
    [[params.editLinks.files]]
      targetPath = "docs/galaxy-tools/_index.md"
      sourcePath = "README.md"
    [[params.editLinks.files]]
      targetPath = "docs/galaxy-tools/how-to-contribute-new-tool.md"
      sourcePath = "CONTRIBUTING.md"

    # Mounted subtree: docs/galaxy-tools/tools/** -> tools/**
    # The stripped path already keeps the leading "tools/", so sourcePrefix is empty here.
    [[params.editLinks.rules]]
      targetPrefix = "docs/galaxy-tools/"
      sourcePrefix = ""

  [[params.editLinks]]
    modulePath = ""
    repo = "https://github.com/earth-data-community/docs-website"
    branch = "main"

    [[params.editLinks.rules]]
      targetPrefix = ""
      sourcePrefix = "content/"
