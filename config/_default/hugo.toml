# -- Site Configuration --
# Earth Data Community documentation site, powered by the Blowfish theme
# (Hugo module import below). The look & feel of the retired earth-data theme
# (hugo-book fork) is recreated with:
#   - config/_default/params.toml     (theme behaviour)
#   - config/_default/languages.en.toml (brand logos, author block)
#   - assets/css/schemes/earth-data.css (color scheme palette)
#   - assets/css/custom.css           (fonts, typography, buttons, callouts)

baseURL = 'https://earth-data-community.github.io/docs-website/'
locale = 'en-us'
title = 'Earth Data Community'

disablePathToLower = true
enableGitInfo = true
enableRobotsTXT = true
enableEmoji = true

# Blowfish default: short summaries are taken from the `description` front
# matter (falling back to full content).
summaryLength = 0

# Date resolution for pages lacking front-matter dates: explicit `date` wins,
# otherwise the first git commit date (gitinfo). :fileModTime is intentionally
# omitted — CI checkouts would give every page the checkout timestamp.
[frontmatter]
  date = ['date', ':git']
  lastmod = [':git', 'lastmod']

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ['html', 'rss', 'json'] # JSON powers the Blowfish search index

[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "series"
    weight = 50

  [[related.indices]]
    name = "authors"
    weight = 20

  [[related.indices]]
    name = "date"
    weight = 10

# Parameters for github action
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[security]
  allowContent = [
    '^text/html$',
    '^text/markdown$',
    '^text/plain$',
    '^image/',
    '^application/json$',
    '^application/pdf$'
  ]

# Needed for obsidian-style callouts, git-style attributes and code blocks
[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false

      [markup.goldmark.parser.attribute]
        block = true

    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

  [markup.highlight]
    style = 'base16-snazzy'

  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3

# Blowfish theme + the galaxy-tools content module (single source of truth
# for module imports, see plan note about arrays not merging across files)
[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v3"

